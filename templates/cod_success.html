{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/code_success.css' %}">

<section class="apple-success-section">
    <div class="apple-success-container">

        <div class="apple-checkmark">
            <svg viewBox="0 0 52 52">
                <circle cx="26" cy="26" r="25" fill="none"/>
                <path fill="none" d="M14 27 l7 7 l16 -16"/>
            </svg>
        </div>

        <h1 class="apple-title">Order Confirmed 🎉</h1>

        <p class="apple-subtitle">
            Thank you for your purchase.  
            Your order will be paid on delivery.
        </p>

        <div class="apple-order-info">
            <p><strong>Order ID 123456 :</strong> #{{ order.id }}</p>
            <p><strong>Total: 632626</strong> ₹{{ order.total_price }}</p>
        </div>

        <a href="{% url 'home' %}" class="apple-btn">
            Continue Shopping
        </a>

    </div>
</section>

{% endblock %}
